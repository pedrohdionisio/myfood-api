services:
  postgres:
    # A imagem oficial postgis/postgis só publica amd64; esta é o mesmo Postgres 16 +
    # PostGIS 3.5 recompilado multi-arch, necessário no Apple Silicon.
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: myfood
      POSTGRES_PASSWORD: myfood
      POSTGRES_DB: myfood
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myfood -d myfood']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Traz as variáveis da AWS sem duplicá-las aqui. O bloco environment vence o env_file,
    # então DATABASE_URL continua apontando para o container do Postgres e não para localhost.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: debug
      DATABASE_URL: postgres://myfood:myfood@postgres:5432/myfood
    ports:
      - '3333:3333'
    volumes:
      - .:/app
      # Preserva o node_modules do container: os binários nativos do host são macOS/arm64
      # e não rodam no alpine/linux.
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # Mesma imagem da API: o que muda é o comando. O Sharp precisa dos binários linux/musl
  # instalados dentro do container, não dos do host.
  image-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm worker:images
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://myfood:myfood@postgres:5432/myfood
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # Drena outbox_events para o SQS. Sem ele o pedido é criado normalmente, mas nenhum
  # agregado se move: o evento fica pendente na tabela até alguém publicar.
  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm worker:outbox
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://myfood:myfood@postgres:5432/myfood
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # Consome a fila e escreve os agregados. Idempotente por processed_messages.
  order-events-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm worker:orders
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://myfood:myfood@postgres:5432/myfood
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
