service: myfood-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 14
  # Uma role para todas as funções: a API e a Lambda de imagem acabam com as permissões uma da
  # outra. Separar exigiria uma role por função, o que ainda não compensa.
  iam:
    role:
      statements:
        - Effect: Allow
          Action: s3:GetObject
          Resource: !Sub '${MediaBucket.Arn}/originals/*'
        - Effect: Allow
          Action: s3:PutObject
          Resource: !Sub '${MediaBucket.Arn}/media/*'
        # O presigned POST do upload é assinado com a credencial da role: sem este PutObject o
        # S3 recusa o envio do cliente, mesmo com a assinatura válida.
        - Effect: Allow
          Action: s3:PutObject
          Resource: !Sub '${MediaBucket.Arn}/originals/*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
          Resource:
            - !GetAtt CustomerUserPool.Arn
            - !GetAtt RestaurantUserPool.Arn

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    # O bundle sai em ESM porque o package.json é type: module, e aí o esbuild troca o require()
    # de toda dependência CJS por um shim que lança "Dynamic require of X is not supported" — o
    # pino faz isso e derrubava a Lambda no init. Com um require real no escopo o shim delega a
    # ele. O alias __cr existe porque o banner entra cru, antes do renomeio do minificador.
    banner:
      js: "import{createRequire as __cr}from'module';const require=__cr(import.meta.url);"
    sourcemap:
      type: linked
      setNodeOptions: true
    exclude:
      # Vem da layer, não do bundle.
      - sharp
      # O padrão do framework é excluir todo @aws-sdk/* e usar o que vem no runtime, cuja
      # versão quem escolhe é a AWS. Embutir o client-s3 prende a versão ao package.json.
      - '@aws-sdk/*'
      - '!@aws-sdk/client-s3'
      # Monta o POST em cima do client-s3: os dois precisam ser da mesma versão, a do bundle.
      - '!@aws-sdk/s3-presigned-post'

layers:
  sharp:
    name: myfood-sharp-${sls:stage}
    description: sharp and its linux/arm64 binaries
    path: layers/sharp
    retain: false
    compatibleArchitectures:
      - arm64
    compatibleRuntimes:
      - nodejs24.x

functions:
  api:
    handler: src/lambda/http.handler
    # O API Gateway HTTP corta em 30s; a Lambda termina antes para o erro ser nosso, não um 503.
    timeout: 29
    memorySize: 1024
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${ssm:/myfood/${sls:stage}/database-url}
      COGNITO_CUSTOMER_POOL_ID: !Ref CustomerUserPool
      COGNITO_CUSTOMER_CLIENT_ID: !Ref CustomerUserPoolClient
      COGNITO_RESTAURANT_POOL_ID: !Ref RestaurantUserPool
      COGNITO_RESTAURANT_CLIENT_ID: !Ref RestaurantUserPoolClient
      S3_BUCKET: !Ref MediaBucket
      SQS_IMAGE_PROCESSING_URL: !Ref ImageProcessingQueue
      SQS_ORDER_EVENTS_URL: !Ref OrderEventsQueue
      ABACATEPAY_API_KEY: ${ssm:/myfood/${sls:stage}/abacatepay-api-key}
      ABACATEPAY_WEBHOOK_SECRET: ${ssm:/myfood/${sls:stage}/abacatepay-webhook-secret}
    events:
      - httpApi: '*'

  cognitoCustomMessage:
    handler: src/lambda/cognito-custom-message.handler
    timeout: 5
    memorySize: 512

  processImage:
    handler: src/lambda/process-image.handler
    # Precisa ser menor que o VisibilityTimeout da fila (120s), senão a mensagem reaparece
    # enquanto ainda está sendo processada e a imagem é convertida duas vezes.
    timeout: 60
    memorySize: 1024
    layers:
      - !Ref SharpLambdaLayer
    environment:
      S3_BUCKET: !Ref MediaBucket
      LOG_LEVEL: info
    events:
      - sqs:
          arn: !GetAtt ImageProcessingQueue.Arn
          batchSize: 10
          # Sem isto, uma imagem corrompida no lote devolve as outras nove para a fila junto.
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    CustomerUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: myfood-customers-${sls:stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        EmailConfiguration:
          # COGNITO_DEFAULT envia para qualquer endereço, com remetente da AWS e teto de 50
          # e-mails/dia. DEVELOPER (SES com remetente próprio) exige domínio verificado e saída do
          # sandbox do SES; sem isso, só endereços verificados recebem o código de cadastro.
          EmailSendingAccount: COGNITO_DEFAULT
        LambdaConfig:
          # ARN escrito à mão em vez de !GetAtt: a permissão abaixo precisa do ARN do pool,
          # e referenciar a função aqui fecharia um ciclo no CloudFormation.
          CustomMessage: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true

    CustomerUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: myfood-app-${sls:stage}
        UserPoolId: !Ref CustomerUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

    RestaurantUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: myfood-restaurants-${sls:stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        EmailConfiguration:
          # COGNITO_DEFAULT envia para qualquer endereço, com remetente da AWS e teto de 50
          # e-mails/dia. DEVELOPER (SES com remetente próprio) exige domínio verificado e saída do
          # sandbox do SES; sem isso, só endereços verificados recebem o código de cadastro.
          EmailSendingAccount: COGNITO_DEFAULT
        LambdaConfig:
          # ARN escrito à mão em vez de !GetAtt: a permissão abaixo precisa do ARN do pool,
          # e referenciar a função aqui fecharia um ciclo no CloudFormation.
          CustomMessage: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true

    RestaurantUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: myfood-dashboard-${sls:stage}
        UserPoolId: !Ref RestaurantUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

    CustomerPoolCustomMessagePermission:
      Type: AWS::Lambda::Permission
      DependsOn: CognitoCustomMessageLambdaFunction
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CustomerUserPool.Arn

    RestaurantPoolCustomMessagePermission:
      Type: AWS::Lambda::Permission
      DependsOn: CognitoCustomMessageLambdaFunction
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt RestaurantUserPool.Arn

    MediaBucket:
      Type: AWS::S3::Bucket
      # O S3 valida a fila no momento em que a notificação é criada, então a policy que
      # autoriza o SendMessage precisa existir antes do bucket.
      DependsOn: ImageProcessingQueuePolicy
      Properties:
        BucketName: myfood-media-${sls:stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          # Falsos porque media/* é lido direto pelo app e pelo dashboard. As ACLs seguem
          # bloqueadas: quem libera a leitura é a bucket policy, e só naquele prefixo.
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [POST, GET]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              MaxAge: 3000
        LifecycleConfiguration:
          Rules:
            # Precisa durar mais que a retenção da ImageProcessingDLQ (14 dias): reprocessar uma
            # mensagem da DLQ lê o original, e ele não pode ter expirado antes.
            - Id: ExpireOriginals
              Status: Enabled
              Prefix: originals/
              ExpirationInDays: 30
        NotificationConfiguration:
          QueueConfigurations:
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt ImageProcessingQueue.Arn
              # O filtro de prefixo é o que impede o worker de reenfileirar o próprio
              # trabalho: ele lê de originals/ e escreve em media/.
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: originals/

    MediaBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref MediaBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadProcessedMedia
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${MediaBucket.Arn}/media/*'

    ImageProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-image-processing-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    ImageProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-image-processing-${sls:stage}
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ImageProcessingDLQ.Arn
          maxReceiveCount: 3

    ImageProcessingQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ImageProcessingQueue
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ImageProcessingQueue.Arn
              Condition:
                ArnLike:
                  # O ARN do bucket é escrito à mão em vez de !GetAtt: o bucket já depende
                  # desta policy, e referenciá-lo aqui fecharia um ciclo no CloudFormation.
                  aws:SourceArn: arn:aws:s3:::myfood-media-${sls:stage}-${aws:accountId}

    OrderEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-order-events-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    OrderEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-order-events-${sls:stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OrderEventsDLQ.Arn
          maxReceiveCount: 5

  extensions:
    # Limite por conta inteira, antes da Lambda. O @fastify/rate-limit conta por instância e não
    # vê as outras, então sozinho ele não segura uma rajada.
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20

  Outputs:
    CustomerUserPoolId:
      Value: !Ref CustomerUserPool
    CustomerUserPoolClientId:
      Value: !Ref CustomerUserPoolClient
    RestaurantUserPoolId:
      Value: !Ref RestaurantUserPool
    RestaurantUserPoolClientId:
      Value: !Ref RestaurantUserPoolClient
    MediaBucketName:
      Value: !Ref MediaBucket
    OrderEventsQueueUrl:
      Value: !Ref OrderEventsQueue
    ImageProcessingQueueUrl:
      Value: !Ref ImageProcessingQueue
