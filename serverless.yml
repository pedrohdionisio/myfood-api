service: myfood-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 14
  # Uma role para todas as funções: a API e a Lambda de imagem acabam com as permissões uma da
  # outra. Separar exigiria uma role por função, o que ainda não compensa.
  iam:
    role:
      statements:
        - Effect: Allow
          Action: s3:GetObject
          Resource: !Sub '${MediaBucket.Arn}/originals/*'
        - Effect: Allow
          Action: s3:PutObject
          Resource: !Sub '${MediaBucket.Arn}/media/*'
        # O presigned POST do upload é assinado com a credencial da role: sem este PutObject o
        # S3 recusa o envio do cliente, mesmo com a assinatura válida.
        - Effect: Allow
          Action: s3:PutObject
          Resource: !Sub '${MediaBucket.Arn}/originals/*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminSetUserPassword
          Resource:
            - !GetAtt CustomerUserPool.Arn
            - !GetAtt RestaurantUserPool.Arn
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt OrderEventsQueue.Arn
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.outboxRelayFunctionName}'
        - Effect: Allow
          Action: scheduler:CreateSchedule
          Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/charge-expiry-*'
        # O Scheduler invoca a Lambda com a role dele; criar o agendamento exige poder repassá-la.
        - Effect: Allow
          Action: iam:PassRole
          Resource: !GetAtt ChargeExpirySchedulerRole.Arn
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt RealtimeConnectionsTable.Arn
            - !Sub '${RealtimeConnectionsTable.Arn}/index/*'
            - !GetAtt RealtimeTicketsTable.Arn
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${sls:stage}/POST/@connections/*'

custom:
  outboxRelayFunctionName: ${self:service}-${sls:stage}-relayOutbox
  settleChargesFunctionName: ${self:service}-${sls:stage}-settleCharges
  # O ambiente de toda função que monta o container (src/config/env.ts). Os nomes das Lambdas são
  # escritos à mão em vez de !GetAtt: a role referencia o relay, e o relay usa a role.
  appEnvironment:
    NODE_ENV: production
    LOG_LEVEL: info
    DATABASE_URL: ${ssm:/myfood/${sls:stage}/database-url}
    COGNITO_CUSTOMER_POOL_ID: !Ref CustomerUserPool
    COGNITO_CUSTOMER_CLIENT_ID: !Ref CustomerUserPoolClient
    COGNITO_RESTAURANT_POOL_ID: !Ref RestaurantUserPool
    COGNITO_RESTAURANT_CLIENT_ID: !Ref RestaurantUserPoolClient
    S3_BUCKET: !Ref MediaBucket
    SQS_IMAGE_PROCESSING_URL: !Ref ImageProcessingQueue
    SQS_ORDER_EVENTS_URL: !Ref OrderEventsQueue
    ABACATEPAY_API_KEY: ${ssm:/myfood/${sls:stage}/abacatepay-api-key}
    ABACATEPAY_WEBHOOK_SECRET: ${ssm:/myfood/${sls:stage}/abacatepay-webhook-secret}
    OUTBOX_RELAY_FUNCTION_NAME: ${self:custom.outboxRelayFunctionName}
    SETTLE_CHARGES_FUNCTION_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.settleChargesFunctionName}'
    CHARGE_EXPIRY_SCHEDULER_ROLE_ARN: !GetAtt ChargeExpirySchedulerRole.Arn
    REALTIME_URL: !Sub 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
    REALTIME_CALLBACK_URL: !Sub 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
    REALTIME_CONNECTIONS_TABLE: !Ref RealtimeConnectionsTable
    REALTIME_TICKETS_TABLE: !Ref RealtimeTicketsTable

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    # O bundle sai em ESM porque o package.json é type: module, e aí o esbuild troca o require()
    # de toda dependência CJS por um shim que lança "Dynamic require of X is not supported" — o
    # pino faz isso e derrubava a Lambda no init. Com um require real no escopo o shim delega a
    # ele. O alias __cr existe porque o banner entra cru, antes do renomeio do minificador.
    banner:
      js: "import{createRequire as __cr}from'module';const require=__cr(import.meta.url);"
    sourcemap:
      type: linked
      setNodeOptions: true
    exclude:
      # Vem da layer, não do bundle.
      - sharp
      # O padrão do framework é excluir todo @aws-sdk/* e usar o que vem no runtime, cuja
      # versão quem escolhe é a AWS. Embutir o client-s3 prende a versão ao package.json.
      - '@aws-sdk/*'
      - '!@aws-sdk/client-s3'
      # Monta o POST em cima do client-s3: os dois precisam ser da mesma versão, a do bundle.
      - '!@aws-sdk/s3-presigned-post'

layers:
  sharp:
    name: myfood-sharp-${sls:stage}
    description: sharp and its linux/arm64 binaries
    path: layers/sharp
    retain: false
    compatibleArchitectures:
      - arm64
    compatibleRuntimes:
      - nodejs24.x

functions:
  api:
    handler: src/lambda/http.handler
    # O API Gateway HTTP corta em 30s; a Lambda termina antes para o erro ser nosso, não um 503.
    timeout: 29
    memorySize: 1024
    environment: ${self:custom.appEnvironment}
    events:
      - httpApi: '*'

  # Nenhuma das três consulta o banco por conta própria em intervalo curto: o Neon só desliga o
  # compute depois de 5 minutos parado, e um cron de minuto o manteria ligado o mês inteiro,
  # acima da cota gratuita de CU-horas. O trabalho chega por evento; o cron horário é só a rede.
  relayOutbox:
    handler: src/lambda/relay-outbox.handler
    name: ${self:custom.outboxRelayFunctionName}
    timeout: 60
    memorySize: 512
    environment: ${self:custom.appEnvironment}
    events:
      - schedule: rate(1 hour)

  orderEvents:
    handler: src/lambda/order-events.handler
    # O VisibilityTimeout da fila (60s) precisa ser pelo menos 6x este valor, como a AWS recomenda
    # para fila com trigger: abaixo disso, mensagem em processamento reaparece e roda duas vezes.
    timeout: 10
    memorySize: 512
    environment: ${self:custom.appEnvironment}
    events:
      - sqs:
          arn: !GetAtt OrderEventsQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  settleCharges:
    handler: src/lambda/settle-charges.handler
    name: ${self:custom.settleChargesFunctionName}
    timeout: 60
    memorySize: 512
    environment: ${self:custom.appEnvironment}
    events:
      - schedule: rate(1 hour)

  # O handshake e o fim de cada conexão WebSocket do dashboard (D23). Não monta o container nem
  # toca o Neon: o ticket já carrega a autorização feita pela API.
  realtimeConnections:
    handler: src/lambda/realtime-connections.handler
    timeout: 10
    memorySize: 256
    environment:
      REALTIME_CONNECTIONS_TABLE: !Ref RealtimeConnectionsTable
      REALTIME_TICKETS_TABLE: !Ref RealtimeTicketsTable
    events:
      - websocket: $connect
      - websocket: $disconnect
      - websocket: $default

  cognitoCustomMessage:
    handler: src/lambda/cognito-custom-message.handler
    timeout: 5
    memorySize: 512

  processImage:
    handler: src/lambda/process-image.handler
    # Precisa ser menor que o VisibilityTimeout da fila (120s), senão a mensagem reaparece
    # enquanto ainda está sendo processada e a imagem é convertida duas vezes.
    timeout: 60
    memorySize: 1024
    layers:
      - !Ref SharpLambdaLayer
    environment:
      S3_BUCKET: !Ref MediaBucket
      LOG_LEVEL: info
    events:
      - sqs:
          arn: !GetAtt ImageProcessingQueue.Arn
          batchSize: 10
          # Sem isto, uma imagem corrompida no lote devolve as outras nove para a fila junto.
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    CustomerUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: myfood-customers-${sls:stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        EmailConfiguration:
          # COGNITO_DEFAULT envia para qualquer endereço, com remetente da AWS e teto de 50
          # e-mails/dia. DEVELOPER (SES com remetente próprio) exige domínio verificado e saída do
          # sandbox do SES; sem isso, só endereços verificados recebem o código de cadastro.
          EmailSendingAccount: COGNITO_DEFAULT
        LambdaConfig:
          # ARN escrito à mão em vez de !GetAtt: a permissão abaixo precisa do ARN do pool,
          # e referenciar a função aqui fecharia um ciclo no CloudFormation.
          CustomMessage: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true

    CustomerUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: myfood-app-${sls:stage}
        UserPoolId: !Ref CustomerUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

    RestaurantUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: myfood-restaurants-${sls:stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        EmailConfiguration:
          # COGNITO_DEFAULT envia para qualquer endereço, com remetente da AWS e teto de 50
          # e-mails/dia. DEVELOPER (SES com remetente próprio) exige domínio verificado e saída do
          # sandbox do SES; sem isso, só endereços verificados recebem o código de cadastro.
          EmailSendingAccount: COGNITO_DEFAULT
        LambdaConfig:
          # ARN escrito à mão em vez de !GetAtt: a permissão abaixo precisa do ARN do pool,
          # e referenciar a função aqui fecharia um ciclo no CloudFormation.
          CustomMessage: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true

    RestaurantUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: myfood-dashboard-${sls:stage}
        UserPoolId: !Ref RestaurantUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

    CustomerPoolCustomMessagePermission:
      Type: AWS::Lambda::Permission
      DependsOn: CognitoCustomMessageLambdaFunction
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CustomerUserPool.Arn

    RestaurantPoolCustomMessagePermission:
      Type: AWS::Lambda::Permission
      DependsOn: CognitoCustomMessageLambdaFunction
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-cognitoCustomMessage'
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt RestaurantUserPool.Arn

    MediaBucket:
      Type: AWS::S3::Bucket
      # O S3 valida a fila no momento em que a notificação é criada, então a policy que
      # autoriza o SendMessage precisa existir antes do bucket.
      DependsOn: ImageProcessingQueuePolicy
      Properties:
        BucketName: myfood-media-${sls:stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          # Falsos porque media/* é lido direto pelo app e pelo dashboard. As ACLs seguem
          # bloqueadas: quem libera a leitura é a bucket policy, e só naquele prefixo.
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [POST, GET]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              MaxAge: 3000
        LifecycleConfiguration:
          Rules:
            # Precisa durar mais que a retenção da ImageProcessingDLQ (14 dias): reprocessar uma
            # mensagem da DLQ lê o original, e ele não pode ter expirado antes.
            - Id: ExpireOriginals
              Status: Enabled
              Prefix: originals/
              ExpirationInDays: 30
        NotificationConfiguration:
          QueueConfigurations:
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt ImageProcessingQueue.Arn
              # O filtro de prefixo é o que impede o worker de reenfileirar o próprio
              # trabalho: ele lê de originals/ e escreve em media/.
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: originals/

    MediaBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref MediaBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadProcessedMedia
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${MediaBucket.Arn}/media/*'

    ImageProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-image-processing-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    ImageProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-image-processing-${sls:stage}
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ImageProcessingDLQ.Arn
          maxReceiveCount: 3

    ImageProcessingQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ImageProcessingQueue
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ImageProcessingQueue.Arn
              Condition:
                ArnLike:
                  # O ARN do bucket é escrito à mão em vez de !GetAtt: o bucket já depende
                  # desta policy, e referenciá-lo aqui fecharia um ciclo no CloudFormation.
                  aws:SourceArn: arn:aws:s3:::myfood-media-${sls:stage}-${aws:accountId}

    OrderEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-order-events-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    OrderEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: myfood-order-events-${sls:stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OrderEventsDLQ.Arn
          maxReceiveCount: 5

    # Uma linha por conexão aberta; o índice responde "quem está olhando este restaurante".
    RealtimeConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: myfood-realtime-connections-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: restaurantId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: by-restaurant
            KeySchema:
              - AttributeName: restaurantId
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    RealtimeTicketsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: myfood-realtime-tickets-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ticket
            AttributeType: S
        KeySchema:
          - AttributeName: ticket
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    ChargeExpirySchedulerRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
        Policies:
          - PolicyName: invoke-settle-charges
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.settleChargesFunctionName}'

  extensions:
    # Limite por conta inteira, antes da Lambda. O @fastify/rate-limit conta por instância e não
    # vê as outras, então sozinho ele não segura uma rajada.
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20

  Outputs:
    OutboxRelayFunctionName:
      Value: ${self:custom.outboxRelayFunctionName}
    SettleChargesFunctionArn:
      Value: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.settleChargesFunctionName}'
    ChargeExpirySchedulerRoleArn:
      Value: !GetAtt ChargeExpirySchedulerRole.Arn
    RealtimeUrl:
      Value: !Sub 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
    RealtimeCallbackUrl:
      Value: !Sub 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
    RealtimeConnectionsTableName:
      Value: !Ref RealtimeConnectionsTable
    RealtimeTicketsTableName:
      Value: !Ref RealtimeTicketsTable
    CustomerUserPoolId:
      Value: !Ref CustomerUserPool
    CustomerUserPoolClientId:
      Value: !Ref CustomerUserPoolClient
    RestaurantUserPoolId:
      Value: !Ref RestaurantUserPool
    RestaurantUserPoolClientId:
      Value: !Ref RestaurantUserPoolClient
    MediaBucketName:
      Value: !Ref MediaBucket
    OrderEventsQueueUrl:
      Value: !Ref OrderEventsQueue
    ImageProcessingQueueUrl:
      Value: !Ref ImageProcessingQueue
